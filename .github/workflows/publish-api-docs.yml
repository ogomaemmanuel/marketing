name: Publish API Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: ./mvnw verify

      - run: |
          mkdir -p docs
          cp api/target/openapi.yaml docs/

      - run: |
          curl -L \
            https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip \
            -o swagger.zip

          unzip swagger.zip

          cp -r swagger-ui-master/dist/* docs/

      - run: |
          sed -i 's#https://petstore.swagger.io/v2/swagger.json#./openapi.yaml#g' docs/index.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs