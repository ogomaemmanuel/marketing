name: Publish API Docs
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
      - run: ./mvnw clean verify
        env:
          SPRING_PROFILES_ACTIVE: "swagger"
      - run: |
          mkdir -p docs
          cp -r api/target/generated-docs/swagger-ui/META-INF/resources/webjars/swagger-ui/5.17.14/* docs/
          cp api/target/generated-docs/swagger-ui/openapi.yaml docs/
          sed -i 's|url: "https://petstore.swagger.io/v2/swagger.json"|url: "openapi.yaml"|g' docs/swagger-initializer.js
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs