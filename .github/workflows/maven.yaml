on:
  push:
    branches:
      - main
jobs:
  test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        name: Checkout
      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 26
          cache: maven
      #    - name: Maven Verify
      #      run: mvn -B clean verify
      - name: Maven Package
        run: mvn -B clean package -DskipTests
      - name: Archive jar files to be used in deploy step
        uses: actions/upload-artifact@v4
        with:
          name: marketing-jars
          path: api/target/*.jar
  push-image-to-docker-hub:
    needs: test
    name: Push to Docker hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 26
          cache: maven
      - name: Maven Package
        run: mvn -B clean package -DskipTests
      - name: Build and push multi-arch images with Docker Compose
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
        run: docker compose build --push
#      - name: Build and push
#        uses: docker/build-push-action@v3
#        with:
#          platforms: linux/amd64,linux/arm64
#          context: "./api"
#          push: true
#          tags: mudho/maketing-api:latest
  deploy:
    needs: push-image-to-docker-hub
    runs-on: ubuntu-latest
    steps:
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.MARKETING_HOST }}
          username: ${{ secrets.MARKETING_HOST_USERNAME }}
          key: ${{ secrets.MARKETING_HOST_SSH_KEY }}
          port: ${{ secrets.MARKETING_HOST_PORT }}
          source: "compose.yaml"
          target: "/opt/marketing"
      - name: Pull and restart containers via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.MARKETING_HOST }}
          username: ${{ secrets.MARKETING_HOST_USERNAME }}
          key: ${{ secrets.MARKETING_HOST_SSH_KEY }}
          port: ${{ secrets.MARKETING_HOST_PORT }}
          script: |
            cd /opt/myapp
            cat << 'EOF' > .env
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f


