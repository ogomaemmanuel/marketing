on:
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
jobs:
  test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        name: Checkout
      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 26
          cache: maven
      #    - name: Maven Verify
      #      run: mvn -B clean verify
      - name: Maven Package
        run: mvn -B clean package -DskipTests
      - name: Archive jar files to be used in deploy step
        uses: actions/upload-artifact@v4
        with:
          name: marketing-jars
          path: api/target/*.jar
  push-image-to-docker-hub:
    needs: test
    name: Push to Docker hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: ${{env.REGISTRY}}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 26
          cache: maven
      - name: Maven Package
        run: mvn -B clean package -DskipTests
      - name: Build and push multi-arch images with Docker Compose
        env:
          DOCKER_USER: ${{ github.actor }}
          DOCKER_REGISTRY: ${{env.REGISTRY}}
        run: docker compose build --push
  #      - name: Build and push
  #        uses: docker/build-push-action@v3
  #        with:
  #          platforms: linux/amd64,linux/arm64
  #          context: "./api"
  #          push: true
  #          tags: mudho/maketing-api:latest
  deploy:
    needs: push-image-to-docker-hub
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.MARKETING_HOST }}
          username: ${{ secrets.MARKETING_HOST_USERNAME }}
          password: ${{secrets.MARKETING_HOST_PASSWORD}}
          port: ${{ secrets.MARKETING_HOST_PORT }}
          source: "compose.yaml"
          target: "/opt/marketing"
      - name: Pull and restart containers via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_URL: ${{ vars.API_URL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DOCKER_REGISTRY: ${{ env.REGISTRY }}
          AUTH_MICROSOFT_ENTRA_ID_API_SCOPE: ${{vars.AUTH_MICROSOFT_ENTRA_ID_API_SCOPE}}
          AUTH_MICROSOFT_ENTRA_ID_ID: ${{vars.AUTH_MICROSOFT_ENTRA_ID_ID}}
          AUTH_MICROSOFT_ENTRA_ID_SECRET: ${{secrets.AUTH_MICROSOFT_ENTRA_ID_SECRET}}
          AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: ${{vars.AUTH_MICROSOFT_ENTRA_ID_TENANT_ID}}
          AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${{vars.AUTH_MICROSOFT_ENTRA_ID_ISSUER}}
        with:
          host: ${{ secrets.MARKETING_HOST }}
          username: ${{ secrets.MARKETING_HOST_USERNAME }}
          password: ${{secrets.MARKETING_HOST_PASSWORD}}
          port: ${{ secrets.MARKETING_HOST_PORT }}
          envs: DATABASE_URL,REDIS_URL,JWT_SECRET,API_URL,GHCR_TOKEN,GHCR_USER,DOCKER_REGISTRY
          script: |
            set +x
            cd /opt/marketing
            umask 077
            cat > .env <<'EOF'
            DATABASE_URL=$DATABASE_URL
            DOCKER_REGISTRY=$DOCKER_REGISTRY
            DOCKER_USER=$GHCR_USER
            REDIS_URL=$REDIS_URL
            JWT_SECRET=$JWT_SECRET
            API_URL=$API_URL
            EOF
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            unset GHCR_TOKEN
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            
            
