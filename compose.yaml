services:
  api:
    container_name: "marketing-service-api"
    networks:
      - marketing
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DB_URL: postgres-db:5432/marketing-main?currentSchema=public
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
  postgres-db:
    container_name: postgres-db
    image: postgres:15.3-alpine
    networks:
      - marketing
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: marketing-main
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d marketing-main" ]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  marketing:
    driver: bridge
    name: marketing
volumes:
  postgres_data:
    driver: local